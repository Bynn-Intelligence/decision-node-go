name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # The conformance suite commit this package targets (suite 1.14). Moving to a
  # newer suite is a reviewed change to this one line.
  CONFORMANCE_REF: a84dadc4c83d2e486c691bf97d03ea7a9dd59336

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.22.x', 'stable']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: Unit tests (the conformance job runs the suite)
        run: go test -race -skip TestConformance ./...

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Check out the conformance suite
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: Bynn-Intelligence/decision-node-conformance
          ref: ${{ env.CONFORMANCE_REF }}
          persist-credentials: false
          path: conformance

      - name: Python for the mock server
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 'stable'

      - name: Run the conformance suite
        env:
          DECISIONNODE_CONFORMANCE_DIR: ${{ github.workspace }}/conformance
        run: go test -count=1 -v -run TestConformance ./...

  # What a public module must not carry: the module zip is every file of the
  # repository at the tag, so every tracked file is checked.
  published-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Test the release name check
        run: python3 .github/scripts/test_check_names.py
      # Internal names are checked here when the secret is set; the release
      # check requires it.
      - name: Check the published files
        env:
          DN_NAME_CHECK_WORDS: ${{ secrets.DN_NAME_CHECK_WORDS }}
        run: python3 .github/scripts/check_names.py --tracked --names-optional
